name: ft_transcendence_test
services:
    backend:
        container_name: ft_transcendence-backend-test
        build:
            context: .
            dockerfile: ./docker/dev-backend.Dockerfile
        user: 1000:1000
        volumes:
            - ./apps/server/:/home/node/apps/server
            - ./packages/shared:/home/node/packages/shared
        networks:
            - ft_network
        ports:
            - 3333:3000
        environment:
            DB_HOST: database
            DB_NAME: ft_transcendence_test
            DB_USER: spongebob
            DB_PASSWORD: krustykrab
            JWT_SECRET: patrick
        command: npx vitest run --maxWorkers=1
        depends_on:
            database:
                condition: service_healthy
    database:
        container_name: ft_transcendence-database-test
        image: postgres:latest
        networks:
            - ft_network
        environment:
            POSTGRES_DB: ft_transcendence_test
            POSTGRES_USER: spongebob
            POSTGRES_PASSWORD: krustykrab
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "sh -c 'pg_isready -U spongebob -d ft_transcendence_test'",
                ]
            interval: 10s
            timeout: 3s
            retries: 3

networks:
    ft_network:
        driver: bridge
