name: ft_transcendence

services:
    frontend:
        container_name: ft_transcendence-frontend
        build:
            context: .
            dockerfile: ./docker/dev-frontend.Dockerfile
            args:
                USER_ID: ${USER_ID:-1000}
                GROUP_ID: ${GROUP_ID:-1000}
        user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
        volumes:
            - ./apps/web:/home/node/apps/web
            - ./packages/shared:/home/node/packages/shared
        networks:
            - ft_bf_network-dev
        ports:
            - "${WEB_PORT:-5173}:5173"
        environment:
            VITE_API_URL: "/api"
            VITE_WS_URL: "ws://localhost:${DEV_API_PORT:-3000}"
        depends_on:
            - backend

    backend:
        container_name: ft_transcendence-backend
        build:
            context: .
            dockerfile: ./docker/dev-backend.Dockerfile
            args:
                USER_ID: ${USER_ID:-1000}
                GROUP_ID: ${GROUP_ID:-1000}
        user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
        volumes:
            - ./apps/server/:/home/node/apps/server
            - ./packages/shared:/home/node/packages/shared
        networks:
            - ft_b_network-dev
            - ft_bf_network-dev
        ports:
            - "${DEV_API_PORT:-3000}:${DEV_API_PORT:-3000}"
        environment:
            API_PORT: ${DEV_API_PORT:-3000}
            DB_HOST: database
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            JWT_SECRET: ${JWT_SECRET}
        depends_on:
            database:
                condition: service_healthy

    database:
        container_name: ft_transcendence-database
        image: postgres:latest
        volumes:
            - database_data-dev:/var/lib/postgresql/18/docker
        networks:
            - ft_b_network-dev
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        healthcheck:
            test: ["CMD-SHELL", 'sh -c "pg_isready -U $DB_USER -d $DB_NAME"']
            interval: 10s
            timeout: 3s
            retries: 3

    pgadmin:
        container_name: ft_transcendence-pgadmin
        image: dpage/pgadmin4:latest
        volumes:
            - pgadmin_data-dev:/var/lib/pgadmin
        networks:
            - ft_b_network-dev
        ports:
            - 8080:80
        depends_on:
            - database
        environment:
            PGADMIN_DEFAULT_EMAIL: apierret@student.42belgium.be
            PGADMIN_DEFAULT_PASSWORD: $DB_PASSWORD
            PGADMIN_CONFIG_SERVER_MODE: False
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: False

volumes:
    database_data-dev:
    pgadmin_data-dev:

networks:
    ft_b_network-dev:
        driver: bridge
    ft_bf_network-dev:
        driver: bridge
