name: ft_transcendence
services:
    frontend:
        container_name: ft_transcendence-frontend
        build:
            context: .
            dockerfile: ./docker/frontend.Dockerfile
        user: 1000:1000
        volumes:
            - ./apps/web:/home/node/apps/web
            - ./packages/shared:/home/node/packages/shared
        ports:
            - "${WEB_PORT:-5173}:5173"
        environment:
            VITE_API_URL: "http://localhost:${API_PORT:-3000}"
        env_file:
            - .env
    backend:
        container_name: ft_transcendence-backend
        build:
            context: .
            dockerfile: ./docker/backend.Dockerfile
        user: 1000:1000
        volumes:
            - ./apps/server/:/home/node/apps/server
            - ./packages/shared:/home/node/packages/shared
        networks:
            - ft_network
        ports:
            - "${API_PORT:-3000}:${API_PORT:-3000}"
        secrets:
            - db_username
            - db_password
            - jwt_secret
        environment:
            DB_HOST: database
            DB_NAME: ft_transcendence
        env_file:
            - .env
        depends_on:
            database:
                condition: service_healthy
    database:
        container_name: ft_transcendence-database
        image: postgres:latest
        volumes:
            - postgres_data:/var/lib/postgresql/18/docker
        networks:
            - ft_network
        secrets:
            - db_username
            - db_password
        environment:
            POSTGRES_USER_FILE: /run/secrets/db_username
            POSTGRES_PASSWORD_FILE: /run/secrets/db_password
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "sh -c 'pg_isready -U $(cat /run/secrets/db_username) -d ft_transcendence'",
                ]
            interval: 10s
            timeout: 3s
            retries: 3
    pgadmin:
        container_name: ft_transcendence-pgadmin
        image: dpage/pgadmin4:latest
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        networks:
            - ft_network
        ports:
            - 80:80
        depends_on:
            - database
        secrets:
            - db_password
        environment:
            PGADMIN_DEFAULT_EMAIL: apierret@student.42belgium.be
            PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/db_password
            PGADMIN_CONFIG_SERVER_MODE: False
            PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: False

volumes:
    postgres_data:
    pgadmin_data:

networks:
    ft_network:
        driver: bridge

secrets:
    db_username:
        file: docker/secrets/db_username.txt
    db_password:
        file: docker/secrets/db_password.txt
    jwt_secret:
        file: docker/secrets/jwt_secret.txt
