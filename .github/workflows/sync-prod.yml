name: Sync Master to Prod (Filtered)

on:
    pull_request:
        branches: [master]
        types: [closed]

jobs:
    sync-to-prod:
        runs-on: ubuntu-latest
        if: github.event.pull_request.merged == true

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Configure Git identity
              run: |
                  git config --global user.name "GitHub Action Bot"
                  git config --global user.email "action@github.com"

            - name: Update prod branch with filters
              run: |
                  git checkout prod || git checkout --orphan prod

                  git reset --hard origin/master

                  rm -f dev-compose.yml test-compose.yml docker/dev-backend.Dockerfile docker/dev-frontend.Dockerfile

                  python3 -c '
                  import re

                  with open("Makefile", "r") as f:
                      content = f.read()

                  content = content.replace("all: dev", "all: prod")

                  content = re.sub(r"# --- DEV START ---.*?# --- DEV END ---\n*", "", content, flags=re.DOTALL)
                  content = re.sub(r"# --- TEST START ---.*?# --- TEST END ---\n*", "", content, flags=re.DOTALL)

                  lines = content.splitlines(keepends=True)
                  new_lines = []
                  for line in lines:
                      if "# DEV LINE" in line or "# TEST LINE" in line:
                          continue
                      line = line.replace("clean: down-prod down-dev test-down", "clean: down-prod")
                      line = line.replace("re: fclean build-prod build-dev", "re: fclean build-prod")
                      new_lines.append(line)

                  with open("Makefile", "w") as f:
                      f.writelines(new_lines)
                  '

                  git add Makefile
                  git commit -m "ci: sync master to prod after PR merge with clean Makefile" || echo "No changes to commit"
                  git push origin prod --force
