name: ft_transcendence-prod

services:
    frontend:
        container_name: ft_transcendence-frontend-prod
        build:
            context: .
            dockerfile: ./docker/prod-frontend.Dockerfile
            args:
                - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
        ports:
            - "443:443"
        networks:
            - ft_network-bf-prod
        depends_on:
            - backend
        secrets:
            - ssl_crt
            - ssl_key

    backend:
        container_name: ft_transcendence-backend-prod
        build:
            context: .
            dockerfile: ./docker/prod-backend.Dockerfile
        volumes:
            - avatars_data:/home/node/apps/server/uploads/avatars
        networks:
            - ft_network-b-prod
            - ft_network-bf-prod
        secrets:
            - db_username
            - db_password
            - jwt_secret
        environment:
            DB_HOST: database
            DB_NAME: ft_transcendence
        depends_on:
            database:
                condition: service_healthy

    database:
        container_name: ft_transcendence-database-prod
        image: postgres:latest
        volumes:
            - database_data:/var/lib/postgresql/18/docker
        networks:
            - ft_network-b-prod
        secrets:
            - db_username
            - db_password
        environment:
            POSTGRES_USER_FILE: /run/secrets/db_username
            POSTGRES_PASSWORD_FILE: /run/secrets/db_password
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "sh -c 'pg_isready -U $(cat /run/secrets/db_username) -d ft_transcendence'",
                ]
            interval: 10s
            timeout: 3s
            retries: 3

volumes:
    database_data:
    avatars_data:

networks:
    ft_network-b-prod:
        driver: bridge
    ft_network-bf-prod:
        driver: bridge

secrets:
    db_username:
        file: docker/secrets/db_username.txt
    db_password:
        file: docker/secrets/db_password.txt
    jwt_secret:
        file: docker/secrets/jwt_secret.txt
    ssl_crt:
        file: docker/secrets/ssl.crt
    ssl_key:
        file: docker/secrets/ssl.key
