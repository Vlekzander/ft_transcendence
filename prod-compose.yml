name: ft_transcendence-prod

services:
    frontend:
        container_name: ft_transcendence-frontend-prod
        build:
            context: .
            dockerfile: ./docker/prod-frontend.Dockerfile
            args:
                - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
                - WEB_PORT=${WEB_PORT:-443}
        ports:
            - "${WEB_PORT:-443}:443"
        networks:
            - ft_network-bf-prod
        depends_on:
            - backend
        secrets:
            - ssl_crt
            - ssl_key

    backend:
        container_name: ft_transcendence-backend-prod
        build:
            context: .
            dockerfile: ./docker/prod-backend.Dockerfile
        volumes:
            - avatars_data:/home/node/apps/server/uploads/avatars
        networks:
            - ft_network-b-prod
            - ft_network-bf-prod
        environment:
            DB_HOST: database
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            JWT_SECRET: ${JWT_SECRET}
        depends_on:
            database:
                condition: service_healthy

    database:
        container_name: ft_transcendence-database-prod
        image: postgres:latest
        volumes:
            - database_data:/var/lib/postgresql/18/docker
        networks:
            - ft_network-b-prod
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        healthcheck:
            test: ["CMD-SHELL", 'sh -c "pg_isready -U $DB_USER -d $DB_NAME"']
            interval: 10s
            timeout: 3s
            retries: 3

volumes:
    database_data:
    avatars_data:

networks:
    ft_network-b-prod:
        driver: bridge
    ft_network-bf-prod:
        driver: bridge

secrets:
    ssl_crt:
        file: docker/secrets/ssl.crt
    ssl_key:
        file: docker/secrets/ssl.key
